<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen Student Insight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE work: a mentor's working tool, calm, precise, strengths-first
   IDEA a light table: each student held up to the light, every domain read as how brightly he is thriving
   PICTURE the 20-week thrive trajectory as a solid lit mass climbing to today's score, domain pulse rows beside it
   COLOUR deep lagoon band #0B2E33, white ground, teal #0E9494 lead, coral #E8613C accent, indigo #5B5BD6 support
   TYPE Manrope 800 display + Inter text
   LAYOUT laptop: band with picker + tabs, identity strip, finding title, chart 2/3 + pulse rows 1/3; phone: stacked */
:root{color-scheme:light dark;
--bg:light-dark(#FFFFFF,#0C1A1B);--panel:light-dark(#F4F8F8,#122426);--line:light-dark(#DCE6E6,#24393B);
--ink:light-dark(#122326,#E6EFEF);--ink2:light-dark(#4E6266,#A9BCBE);--ink3:light-dark(#6E8185,#8DA1A3);
--band:light-dark(#0B2E33,#071E21);--bandink:#E8F3F3;--bandink2:#9FC3C4;
--s1:light-dark(#0E9494,#11A39F);--s2:light-dark(#E8613C,#E8653F);--s3:light-dark(#5B5BD6,#7B7BEB);
--s1soft:light-dark(#D7EFEE,#163B3B);--gray:light-dark(#B9C6C7,#4A5E60);
--good:light-dark(#1F7F55,#3DB27E);--warn:light-dark(#A86400,#E0A040);--crit:light-dark(#C2364E,#F06A80);
--goodbg:light-dark(#E3F3EA,#14301F);--warnbg:light-dark(#FBF0DC,#33270F);--critbg:light-dark(#FBE5E9,#3A1A20)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Manrope,Inter,sans-serif;letter-spacing:-.02em;margin:0;color:var(--ink)}
button,input{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(16px,3vw)}
.top{background:var(--band);color:var(--bandink)}
.topin{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-top:14px;padding-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand b{font:800 22px/1 Manrope,sans-serif;letter-spacing:-.03em}
.brand span{color:var(--bandink2);font-size:13px}
.brand .ds{font-style:normal;font-weight:700;letter-spacing:.02em;color:#D4AE72}
.picker{position:relative}
.pickbtn{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 14px;border-radius:10px;border:1px solid #2C5257;background:#103C42;cursor:pointer;color:var(--bandink)}
.pickbtn:hover{background:#15474E}.pickbtn:focus-visible,.tab:focus-visible,.seg button:focus-visible,.row-btn:focus-visible{outline:2px solid var(--s2);outline-offset:2px}
.pickbtn small{color:var(--bandink2)}
.pop{position:absolute;right:0;top:calc(100% + 6px);width:min(360px,92vw);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);z-index:20;display:none}
.pop.open{display:block}
.pop input{width:100%;font-size:16px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;border-radius:12px 12px 0 0}
.pop input:focus{outline:none;background:var(--panel)}
.plist{max-height:340px;overflow:auto;padding:6px}
.pgrp{font-size:12px;color:var(--ink3);padding:8px 8px 2px;font-weight:600}
.popt{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer}
.popt:hover,.popt.on{background:var(--panel)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;border:0;background:none;color:var(--bandink2);padding:12px 14px 13px;cursor:pointer;font-weight:600;border-bottom:3px solid transparent;min-height:44px}
.tab:hover{color:#fff}.tab.on{color:#fff;border-bottom-color:var(--s2)}
.id{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px 20px;align-items:center;padding-top:22px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font:800 19px Manrope,sans-serif;background:var(--s1soft);color:var(--s1)}
.id h2{font-size:clamp(22px,3vw,28px);line-height:1.1}
.meta{color:var(--ink2);font-size:14px;margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--panel);color:var(--ink2);border:1px solid var(--line)}
.thrive{text-align:right}
.thrive .n{font:800 clamp(38px,5vw,52px)/1 Manrope,sans-serif;letter-spacing:-.03em;color:var(--s1)}
.thrive .l{font-size:13px;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px 2px 7px;border-radius:99px;white-space:nowrap}
.chip svg{width:12px;height:12px}
.c-good{background:var(--goodbg);color:var(--good)}.c-warn{background:var(--warnbg);color:var(--warn)}.c-crit{background:var(--critbg);color:var(--crit)}
.view{display:none;padding-top:22px;padding-bottom:40px}.view.on{display:block}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.vh h1{font-size:clamp(24px,3.2vw,34px);line-height:1.08;max-width:30ch;text-wrap:balance}
.vh p{margin:6px 0 0;color:var(--ink2);max-width:70ch}
.grid{display:grid;gap:16px}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g11{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g111{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--bg)}
.card.tint{background:var(--panel)}
.card h3{font-size:16px;margin-bottom:2px}
.sub{color:var(--ink3);font-size:13px;margin:0 0 12px}
.fig{position:relative;min-height:260px}.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fig.tall{min-height:320px}.fig.short{min-height:200px}
svg text{font:12px Inter,sans-serif;fill:var(--ink3)}
svg .lbl{fill:var(--ink);font-weight:600;paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .v{font:800 26px/1.1 Manrope,sans-serif;letter-spacing:-.02em;white-space:nowrap}
.kpi .k{font-size:13px;color:var(--ink2)}
.kpi .d{font-size:12px;color:var(--ink3);margin-top:2px}
.up{color:var(--good)}.down{color:var(--crit)}
.prow{display:grid;grid-template-columns:minmax(92px,1.1fr) minmax(0,1.4fr) 34px minmax(54px,.8fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow .nm{font-weight:600;font-size:14px}
.track{height:8px;border-radius:4px;background:var(--panel);position:relative;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--s1)}
.num{font-variant-numeric:tabular-nums;text-align:right;font-weight:600;white-space:nowrap}
.spark{width:100%;height:26px;display:block}
.pr2{padding:8px 0;border-top:1px solid var(--line)}
.pr2:first-of-type{border-top:0}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
.ptop .nm{font-weight:600;font-size:14px}
.pbot{display:grid;grid-template-columns:minmax(0,1.3fr) 30px minmax(50px,1fr) 34px;gap:10px;align-items:center}
.riskcap{font-size:12px;color:var(--ink3);margin:14px 0 2px;padding-top:10px;border-top:2px solid var(--line)}
.brow{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 52px;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.btrack{height:14px;position:relative;background:var(--panel);border-radius:3px}
.btrack i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--s1)}
.btrack .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.strip{position:relative;height:28px;border-top:1px solid var(--line)}
.strip .dt{position:absolute;top:9px;width:10px;height:10px;border-radius:50%;background:var(--gray);transform:translateX(-50%);opacity:.8}
.strip .me{top:6px;width:16px;height:16px;background:var(--s1);border:2px solid var(--bg);opacity:1;z-index:2}
.srow{display:grid;grid-template-columns:110px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:14px}
.sig{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.sig:first-of-type{border-top:0}
.sig svg{width:18px;height:18px;margin-top:2px}
.sig b{display:block;font-size:14px}
.sig p{margin:2px 0 0;font-size:14px;color:var(--ink2)}
.sig .act{color:var(--ink);margin-top:6px}
.qlist{margin:6px 0 0;padding-left:20px}.qlist li{margin:6px 0}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--panel);border:1px solid var(--line);margin:0 4px 4px 0}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:76px 12px minmax(0,1fr);gap:10px;padding:7px 0;font-size:14px}
.tl .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--s1)}
.tl time{color:var(--ink3);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:600;color:var(--ink2);text-align:left;font-size:13px;border-bottom:1px solid var(--line);padding:8px 8px}
td{border-bottom:1px solid var(--line);padding:8px 8px;vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.heat td.h{text-align:center;font-weight:700;border:2px solid var(--bg);border-radius:6px;min-width:44px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--panel);flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 12px;border-radius:7px;cursor:pointer;min-height:38px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink2);margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--ink3) 0 4px,transparent 4px 7px)!important}
.legend i.box{height:10px;opacity:.35}
.db{display:grid;grid-template-columns:minmax(120px,1.2fr) minmax(0,2fr) 44px;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.dbt{position:relative;height:20px}
.dbt:before{content:"";position:absolute;left:0;right:0;top:9px;height:2px;background:var(--panel)}
.dbt .ln{position:absolute;top:9px;height:2px;background:var(--gray)}
.dbt .a,.dbt .b{position:absolute;top:4px;width:12px;height:12px;border-radius:50%;transform:translateX(-50%);border:2px solid var(--bg)}
.dbt .a{background:var(--s1)}.dbt .b{background:var(--gray)}
.empty{padding:22px;border:1px dashed var(--line);border-radius:12px;color:var(--ink2);text-align:center}
.quote{border-left:3px solid var(--s1);padding:6px 12px;margin:8px 0;color:var(--ink2);font-size:14px}
.watch{cursor:pointer}.watch:hover td{background:var(--panel)}
.row-btn{border:0;background:none;padding:0;cursor:pointer;font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
#tip{position:fixed;pointer-events:none;z-index:50;background:var(--ink);color:var(--bg);font-size:13px;padding:7px 10px;border-radius:8px;max-width:240px;opacity:0;transition:opacity .1s;line-height:1.4}
#tip b{font-weight:600}
foot,.foot{display:block;border-top:1px solid var(--line);padding-top:16px;padding-bottom:40px;color:var(--ink3);font-size:13px}
.foot details{margin-top:10px}.foot summary{cursor:pointer;color:var(--ink2);font-weight:600}
.foot code{font-size:12px;overflow-wrap:anywhere}
@media(max-width:900px){.g21,.g111{grid-template-columns:minmax(0,1fr)}}
@media(max-width:700px){.pbot{grid-template-columns:minmax(0,1fr) 30px 34px}.pbot .sp{display:none}.g11{grid-template-columns:minmax(0,1fr)}.id{grid-template-columns:auto minmax(0,1fr)}.thrive{grid-column:1/-1;text-align:left;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.prow{grid-template-columns:minmax(84px,1fr) minmax(0,1fr) 30px auto}.prow .sp{display:none}.brand span{display:none}}
@media(max-width:600px){table{font-size:13px}th,td{padding:6px 4px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 0;text-align:right}.stack td::before{content:attr(data-l);color:var(--ink3);text-align:left;flex:none}}
@media(prefers-reduced-motion:no-preference){.grow{animation:grow .7s ease-out both}@keyframes grow{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}}
</style>
</head>

{ const t2 = new Date(2026, 3, 27), t3 = new Date(2026, 6, 20);
  for (let i = 0; i < 10; i++) WEEKS.push({ d: new Date(t2.getTime() + i * 7 * 864e5), lab: 'T2 W' + (i + 1) });

const LAST = ['Tran','Mehta','O’Connor','Nguyen','Patel','Walsh','Kim','Rossi','Fraser','Chen','Lim','Hughes','Singh','Murphy','Costa','Papadopoulos','Ito','Byrne','Morrison','Ahmed','Silva','Fitzgerald','Park','Wong','Dimitriou','Kelly','Novak','Reid','Bose','Hall','Lee','Gomez','Turner','Haddad','Clarke','Moreau'];
const HOUSES = ['Banks','Florey','Mawson','Oliphant','Hargrave','Kingsford'];

const SUBJ_JR = ['English','Mathematics','Science','History','Geography','PDHPE','Music','Design & Technology','French'];
const SUBJ_SR = ['English Advanced','Mathematics Ext 1','Physics','Chemistry','Economics','Modern History'];
const TERMS = ['T4 2025','T1 2026','T2 2026','T3 2026'];

function makeStudent(i) {
  const R = rng(9001 + i * 131);
  const year = 7 + Math.floor(i / 12);
  const name = FIRST[(i * 7 + 3) % FIRST.length] + ' ' + LAST[(i * 11 + 5) % LAST.length];

  s.boarder = R() < .25; s.eald = R() < .12; s.intl = R() < .08; s.dl = R() < .24; s.fn = R() < .04;

    const off = norm(R) * 22, slope = trend * (1.2 + R()) + norm(R) * .4;
    const latest = clamp(base * 95 + off + 8, 3, 97);

  s.ext = WL.map((_, w) => clamp((1 - base) * 70 + 10 * Math.sin(i) + w * .4 * (i % 2 ? 1 : -.5) + norm(R) * 1.1, 4, 98));
  s.lead = WL.map((_, w) => clamp(100 - s.risk.lp[w] * .7 - 10 + (i % 5) * 4 + norm(R) * 1.1, 4, 98));
  // learning
  const subs = year >= 11 ? SUBJ_SR : SUBJ_JR;
  const acaLv = (50 - s.risk.aca[NW - 1]) / 30;
  s.subjects = subs.map(n => {
    const ab = r1(clamp(acaLv * .7 + norm(R) * .45 + .2, -2.4, 2.4));
    const drift = norm(R) * .18 + (trend > .3 ? -.12 : 0);
    const gapBias = R() < .25 ? -(.5 + R() * .5) : norm(R) * .3;
    const z = TERMS.map((_, t) => r1(clamp(ab + gapBias + drift * (t - 3) + norm(R) * .15, -2.6, 2.6)));
    const att = r1(clamp(100 - s.risk.att[NW - 1] * .26 + norm(R) * 3, 62, 100));
    const lp = ['Perseverance','Mindset','Social','Behavioural'].map(() => r1(clamp(4.3 - s.risk.lp[NW - 1] / 34 + norm(R) * .45, 1, 5)));
    return { n, ab, z, att, lp };
  });
  // attendance
  s.attW = WL.map((_, w) => r1(clamp(99.2 - s.risk.att[w] * .27 + norm(R) * 1.8, 55, 100)));
  const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
  s.win = [['Last 7 days', s.attW[NW - 1]], ['Last 14 days', avg(s.attW.slice(-2))], ['Last 30 days', avg(s.attW.slice(-4))], ['Term 3', avg(s.attW.slice(10))], ['Year to date', avg(s.attW) - .4]].map(([k, v]) => [k, r1(v)]);
  s.winEx = s.win.map(([k, v]) => [k, r1(Math.min(100, v + 1 + R() * 1.5))]);
  const conc = Math.max(0, Math.round((100 - s.win[3][1]) / 1.6 + norm(R)));
  const wbias = R() < .45 ? [2.2, 1, 1, 1, 1.8] : [1, 1, 1, 1, 1];
  s.wkAbs = [0, 0, 0, 0, 0]; for (let k = 0; k < conc; k++) { let t = R() * wbias.reduce((a, b) => a + b), j = 0; while (t > wbias[j]) { t -= wbias[j]; j++; } s.wkAbs[Math.min(j, 4)]++; }

  s.lateClass = Math.round(s.risk.att[NW - 1] / 9 + R() * 3); s.lateSchool = Math.round(s.risk.att[NW - 1] / 14 + R() * 2);

  s.dis = WL.map((_, w) => clamp(.55 * s.risk.att[w] + .35 * s.risk.beh[w] - 8 + norm(R) * 2.2, 2, 98));
  { const dl = last(s.dis); s.disC = [['Lateness rate', .40], ['Event volume', .20], ['Subject concentration', .15], ['Minutes lost', .25]].map(([n, wt]) => ({ n, wt, v: Math.round(clamp(dl + norm(R) * 12, 0, 100)) })); s.dis[NW - 1] = s.disC.reduce((a, c) => a + c.wt * c.v, 0); }
  s.minsLost = Math.round(s.lateClass * 7 + R() * 20); s.concLate = Math.round(s.lateClass * .6); s.disSubj = pick(R, subs);
  const types = [['Unexplained', 'No reason provided'], ['Medical', 'Unwell'], ['Medical', 'Appointment'], ['Leave', 'Family commitment'], ['School activity', 'Representative sport']];
  s.absLog = [];
  const nAbs = conc + Math.floor(R() * 3);
  for (let k = 0; k < nAbs; k++) { const wk = 10 + Math.floor(R() * 10), dow = Math.floor(R() * 5), t = k < conc ? (R() < .45 ? types[0] : pick(R, types.slice(1, 4))) : types[4]; const d = new Date(WEEKS[wk].d.getTime() + dow * 864e5); s.absLog.push({ d, subj: pick(R, subs), per: 'P' + (1 + Math.floor(R() * 6)), type: t[0], reason: t[1], mins: pick(R, [50, 50, 100, 300]), ok: t[0] !== 'Unexplained' }); }

function afterWellbeing(s) { divCols(document.getElementById('f-beh'), s.pos, s.neg, WL); }

function vGrowth(s) {
  const f = first(s), nrm = LEX_NORM[s.year], lx = last(s.lex), g8 = lx - s.lex[NW - 9], gAll = lx - s.lex[0];
  const pos = lx >= nrm[2] ? 'above the national 75th percentile' : lx >= nrm[1] ? 'between the national median and 75th percentile' : lx >= nrm[0] ? 'between the national 25th percentile and median' : 'below the national 25th percentile';
  const head = `${f} reads at ${lx}L, ${pos} for Year ${s.year}`;
  const byCat = {}; s.acts.forEach(a => (byCat[a.c] = byCat[a.c] || []).push(a));
  const lvC = { Exceeding: 'good', Strong: 'good', Developing: 'warn', 'Needs additional support': 'crit' };
  return `<div class="vh"><div><h1>${head}</h1><p>Reading growth, potential, co-curricular footprint and external results.</p></div></div>
  <div class="kpis">
    <div class="kpi"><div class="k">Lexile now</div><div class="v">${lx}L</div><div class="d">Up ${gAll}L since Term 2</div></div>
    <div class="kpi"><div class="k">Last 8 weeks</div><div class="v ${g8 >= 20 ? 'up' : 'down'}">+${g8}L</div><div class="d">Year median about +27L</div></div>
    <div class="kpi"><div class="k">Quizzes, Term 3</div><div class="v">${s.quiz.slice(10).reduce((a, b) => a + b, 0)}</div><div class="d">Pass rate ${s.pass}%</div></div>
    <div class="kpi"><div class="k">Allwell ability</div><div class="v">${s.allwell}<span style="font-size:15px">th</span></div><div class="d">Percentile on entry</div></div>
  </div>
  <div class="grid g21">
    <div class="card"><h3>Reading level vs national band</h3><p class="sub">Shaded band is the Year ${s.year} national 25th–75th percentile</p>
      <div class="legend"><span><i style="background:var(--s1)"></i>${esc(f)}</span><span><i class="dash"></i>Year ${s.year} median at school</span><span><i class="box" style="background:var(--gray)"></i>National 25th–75th</span></div><div class="fig" id="f-lex"><svg></svg></div></div>
    <div class="card"><h3>Potential</h3><p class="sub">Extension and leadership potential, weekly</p>
      <div class="legend"><span><i style="background:var(--s3)"></i>Extension</span><span><i style="background:var(--s2)"></i>Leadership</span></div><div class="fig" id="f-pot"><svg></svg></div></div>
  </div>
  <div class="grid g111" style="margin-top:16px">
    <div class="card"><h3>Co-curricular footprint</h3><p class="sub">${s.acts.length} activit${s.acts.length === 1 ? 'y' : 'ies'} in Terms 2–3</p>
      ${s.acts.length ? Object.entries(byCat).map(([c, list]) => `<div style="padding:6px 0;border-top:1px solid var(--line)"><b style="font-size:14px">${c}</b><div style="margin-top:4px">${list.map(a => `<span class="pill">${esc(a.a)} &middot; ${a.t}</span>`).join('')}</div></div>`).join('') : '<div class="empty">No co-curricular activity recorded.</div>'}</div>
    <div class="card"><h3>External competitions</h3><p class="sub">2026, z-score against all entrants</p>
      ${s.comps.length ? `<table><thead><tr><th>Competition</th><th>Result</th><th class="n">z</th></tr></thead><tbody>${s.comps.map(c => `<tr><td>${c.c}</td><td>${c.r}</td><td class="n">${c.z > 0 ? '+' : ''}${c.z}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">No competitions entered this year.</div>'}</div>
    <div class="card"><h3>NAPLAN</h3><p class="sub">Proficiency level by domain</p>
      ${s.naplan.length ? s.naplan.map(n => `<b style="font-size:14px">Year ${n.yr}</b><table style="margin:4px 0 12px"><tbody>${n.res.map(([d, l]) => `<tr><td>${d}</td><td style="text-align:right"><span class="chip c-${lvC[l]}">${ICON[lvC[l]]}${l}</span></td></tr>`).join('')}</tbody></table>`).join('') : `<div class="empty">Year ${s.year} sits NAPLAN in Term 1 next year.</div>`}</div>
  </div>`;
}
function afterGrowth(s) {
  const nrm = LEX_NORM[s.year], lo = Math.floor(Math.min(nrm[0], ...s.lex) / 50) * 50 - 50, hi = Math.ceil(Math.max(nrm[2], ...s.lex) / 50) * 50 + 50;
  lineChart(document.getElementById('f-lex'), { x: WL, xFull: WEEKS.map(w => `${w.lab}, ${fmtD(w.d)}`), y: [lo, hi], band: { lo: WL.map(() => nrm[0]), hi: WL.map(() => nrm[2]), n: 'National 25th–75th' }, fmt: (v, t) => t ? v + 'L' : v, series: [{ n: first(s), v: s.lex, c: 'var(--s1)', w: 2.5, dotLast: true, lastLab: last(s.lex) + 'L' }, { n: 'School median', v: s.lexCo, c: 'var(--ink3)', dash: '4 4', w: 1.5 }] });
  lineChart(document.getElementById('f-pot'), { x: WL, xFull: WEEKS.map(w => `${w.lab}, ${fmtD(w.d)}`), y: [0, 100], endLabels: false, fmt: (v, t) => t ? Math.round(v) : v, series: [{ n: 'Extension', v: s.ext.map(r1), c: 'var(--s3)' }, { n: 'Leadership', v: s.lead.map(r1), c: 'var(--s2)' }] });
}

function vCare(s) {
  const f = first(s);
  if (!s.plan) return `<div class="vh"><div><h1>${f} has no support plan on record</h1><p>Lumen shows plan details, adjustments and the change history here when a plan exists.</p></div></div><div class="empty">No learning support plan, NCCD level or adjustments recorded for ${esc(s.name)}.</div>`;
  const p = s.plan;
  return `<div class="vh"><div><h1>${f} receives ${p.lv.toLowerCase()} adjustments</h1><p>NCCD category: ${p.cat}. ${p.ad.length} adjustments in place; last reviewed ${fmtD(last(p.log).d)}.</p></div></div>
  <div class="grid g21">
    <div class="card"><h3>Adjustments in place</h3><p class="sub">Teachers should apply these in every class</p>
      <div>${p.ad.map(a => `<span class="pill" style="font-size:14px;padding:6px 10px">${a}</span>`).join('')}</div>
      <h3 style="margin-top:18px">Provision</h3><p style="margin:4px 0 0;color:var(--ink2)">${p.prov}</p>
      <h3 style="margin-top:18px">Voices</h3><div class="quote"><b style="color:var(--ink)">${esc(f)}</b><br>“${esc(p.sv)}”</div><div class="quote" style="border-color:var(--s3)"><b style="color:var(--ink)">Parent</b><br>“${esc(p.pv)}”</div></div>
    <div class="card tint"><h3>Plan history</h3><p class="sub">Changes to level, adjustments and reviews</p>
      <ul class="tl">${[...p.log].reverse().map(e => `<li><time>${fmtD(e.d)}</time><span class="dot" style="background:var(--s3)"></span><span><b style="font-weight:600">${e.t}</b><br><span style="color:var(--ink2)">${esc(e.v)}</span></span></li>`).join('')}</ul></div>
  </div>`;
}

function vCohort(s) {
  const peers = STUDENTS.filter(x => x.year === s.year);
  const slip = peers.filter(p => mom(p) < -3).length, act = peers.filter(p => last(p.thrive) < 34).length;
  const watch = [...peers].sort((a, b) => (last(a.thrive) + mom(a) * 2) - (last(b.thrive) + mom(b) * 2)).slice(0, 8);
  return `<div class="vh"><div><h1>${slip} of ${peers.length} Year ${s.year} students are slipping this month</h1><p>Thrive now against its 4-week change. Click a dot or a name to open that student.</p></div></div>
  <div class="grid g21">
    <div class="card"><h3>Year ${s.year}: level and direction</h3><p class="sub">Thrive up, 4-week change across. ${act} below 34, needing a plan.</p><div class="fig tall" id="f-coh"><svg></svg></div></div>
    <div class="card"><h3>Watchlist</h3><p class="sub">Lowest thrive, weighted by recent slide</p>
      <table><thead><tr><th>Student</th><th class="n">Thrive</th><th class="n">4 wk</th><th>Disengagement</th></tr></thead><tbody>${watch.map(p => `<tr class="watch"><td><button class="row-btn" data-open="${p.i}">${esc(p.name)}</button></td><td class="n">${Math.round(last(p.thrive))}</td><td class="n ${mom(p) >= 0 ? 'up' : 'down'}">${mom(p) >= 0 ? '+' : '−'}${Math.abs(mom(p))}</td><td>${disChip(last(p.dis))}</td></tr>`).join('')}</tbody></table></div>
  </div>`;
}
function afterCohort(s) {
  const peers = STUDENTS.filter(x => x.year === s.year), mm = peers.map(mom), lim = Math.ceil(Math.max(8, ...mm.map(Math.abs)) / 2) * 2;
  scatter(document.getElementById('f-coh'), { x: [-lim, lim], y: [0, 100], cross: [0, 50], xl: '4-week change →', yl: 'Thrive', corners: [['Thriving, rising', 'tr'], ['Thriving, slipping', 'tl'], ['Low, slipping', 'bl'], ['Low, recovering', 'br']],
    pts: peers.map(p => ({ x: mom(p), y: last(p.thrive), c: p === s ? 'var(--s1)' : last(p.thrive) < 34 ? 'var(--s2)' : 'var(--gray)', hl: p === s, r: p === s ? 8 : 6, lab: p === s ? first(p) : null, id: p.i, tip: `<b>${esc(p.name)}</b><br>Thrive ${Math.round(last(p.thrive))} &middot; ${mom(p) >= 0 ? '+' : ''}${mom(p)} in 4 weeks` })),
    click: p => select(STUDENTS[p.id], 'pulse') });
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => select(STUDENTS[+b.dataset.open], 'pulse'));
}

const V = { pulse: [vPulse, afterPulse], learning: [vLearning, afterLearning], attendance: [vPresence, afterPresence], wellbeing: [vWellbeing, afterWellbeing], growth: [vGrowth, afterGrowth], support: [vCare, () => {}], cohort: [vCohort, afterCohort] };
function render() {
  observers.forEach(o => o.disconnect()); observers = []; hideTip();
  renderIdent(cur);
  VIEWS.forEach(([k]) => { document.getElementById('v-' + k).classList.toggle('on', k === view); document.getElementById('tab-' + k).classList.toggle('on', k === view); });
  const el = document.getElementById('v-' + view); el.innerHTML = V[view][0](cur); V[view][1](cur); bindRowTips(el);
}
function select(s, v) { cur = s; try { localStorage.setItem('lumen-student', s.i); } catch (e) {} closePop(); if (v && v !== view) location.hash = v; else render(); }

/* ---------- picker ---------- */
const pop = document.getElementById('pop'), q = document.getElementById('q'), plist = document.getElementById('plist'), pickbtn = document.getElementById('pickbtn');
function fillList() { const t = q.value.trim().toLowerCase(); let h = ''; for (let y = 7; y <= 12; y++) { const l = STUDENTS.filter(s => s.year === y && (!t || s.name.toLowerCase().includes(t) || s.code.toLowerCase().includes(t))); if (l.length) h += `<div class="pgrp">Year ${y}</div>` + l.map(s => `<button class="popt${s === cur ? ' on' : ''}" role="option" data-i="${s.i}"><span>${esc(s.name)}</span>${chip(last(s.thrive))}</button>`).join(''); } plist.innerHTML = h || '<div class="pgrp">No match</div>'; }
function closePop() { pop.classList.remove('open'); pickbtn.setAttribute('aria-expanded', 'false'); }
pickbtn.onclick = e => { e.stopPropagation(); const o = pop.classList.toggle('open'); pickbtn.setAttribute('aria-expanded', o); if (o) { q.value = ''; fillList(); q.focus(); } };
q.oninput = fillList;
q.onkeydown = e => { if (e.key === 'Escape') { closePop(); pickbtn.focus(); } if (e.key === 'Enter') { const b = plist.querySelector('.popt'); if (b) select(STUDENTS[+b.dataset.i]); } };
plist.onclick = e => { const b = e.target.closest('.popt'); if (b) select(STUDENTS[+b.dataset.i]); };
document.addEventListener('click', e => { if (!e.target.closest('.picker')) closePop(); });

function route() { const h = location.hash.slice(1); view = V[h] ? h : 'pulse'; render(); }
addEventListener('hashchange', route);
route();
}
</script>
</body>
</html>
